name: detector_ervas_daninhas
description: Aplicativo para detecção de ervas daninhas com IA

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # IA / TFLite
  tflite_flutter: ^0.12.1
  image: ^4.5.4



  # Câmera / Arquivos
  image_picker: ^1.0.7
  path_provider: ^2.1.5

  # Localização
  geolocator: ^14.0.2

  # Armazenamento
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Mapas / Geo
  latlong2: ^0.9.1
  flutter_map: ^8.2.2

  # Internet / APIS
  http: ^1.1.0
  connectivity_plus: ^7.0.0

  # Gráficos / UI
  fl_chart: ^0.64.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/logo.png
    - assets/icons/models/weed_detector.tflite
    - assets/icons/models/weed_detector_compat.tflite

    - assets/icons/models/labels.txt

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
